name: Leg Room
on:
  schedule:
    - cron: '8 20 * * *'
    - cron: '22 20-23,0-6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: legroom
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update data
        continue-on-error: true
        run: python update.py ${{ github.event.schedule == '22 20-23,0-6 * * *' && 'quick' || 'full' }}
      - name: Save data
        run: |
          git config user.name "legroom-bot"
          git config user.email "legroom-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data" && git pull --rebase -q && git push)
      - name: Build site
        run: |
          mkdir -p _site data
          cp index.html _site/
          cp -r data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
